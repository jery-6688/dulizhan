<body class="font-inter antialiased text-[#1a2533] bg-white">

<!-- Shared Header (rendered by main.js) -->
<div id="site-header"></div>

<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 pt-24">
  <article id="postArticle"></article>
</main>

<section id="relatedPosts" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20"></section>

<!-- Shared Footer (rendered by main.js) -->
<div id="site-footer"></div>

<!-- Shared Floating Buttons (rendered by main.js) -->
<div id="site-floating-buttons"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    var post = (window.AQUA.posts||[]).find(function(p){return p.id===id;});
    var art = document.getElementById('postArticle');
    var rel = document.getElementById('relatedPosts');
    if(!post){
      art.innerHTML = '<div class="text-center py-20"><h1 class="text-2xl font-bold text-primary mb-4">文章未找到</h1><p class="text-textsoft mb-6">该文章可能已被删除或下架。</p><a href="news.html" class="inline-block px-5 py-2.5 bg-primary text-white rounded-full hover:bg-primary-dark">返回博客列表</a></div>';
      rel.style.display='none';
      return;
    }
    document.title = post.title + ' — XINPUREAO Blog';
    art.innerHTML = `
      <a href="news.html" class="text-sm text-primary hover:underline mb-4 inline-block"><i class="fa-solid fa-arrow-left mr-1"></i>返回博客</a>
      <div class="flex items-center gap-2 text-xs text-textlight mb-3">
        <span class="px-2.5 py-1 bg-bgsoft text-primary rounded-full font-medium">${post.cat||'Blog'}</span>
        <span>${post.date||''}</span>${post.author?`<span>· ${post.author}</span>`:''}
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold text-[#0b1b33] leading-tight mb-6">${post.title}</h1>
      ${post.cover?`<img src="${post.cover}" alt="${post.title}" class="w-full aspect-[16/9] object-cover rounded-2xl mb-8 shadow-md">`:''}
      <div class="prose max-w-none text-[#30415c] leading-relaxed space-y-4 post-content">${post.content||post.excerpt||''}</div>
      ${(post.tags&&post.tags.length)?`<div class="mt-10 flex flex-wrap gap-2">${post.tags.map(function(t){return '<span class="px-3 py-1 bg-bgsoft text-textsoft text-xs rounded-full">#'+t+'</span>';}).join('')}</div>`:''}
    `;
    // 相关文章（同分类取 3 篇，排除当前）
    var related = (window.AQUA.posts||[]).filter(function(p){return p.cat===post.cat && p.id!==post.id;}).slice(0,3);
    if(related.length){
      rel.innerHTML = `<h2 class="text-xl font-bold text-[#0b1b33] mb-6">相关文章</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-5">`+related.map(function(p){
        return `<a href="post.html?id=${p.id}" class="group bg-white rounded-2xl border border-[#eef2f6] overflow-hidden hover:shadow-md transition-shadow">
          <div class="aspect-[16/9] overflow-hidden bg-bgsoft"><img src="${p.cover||'https://images.unsplash.com/photo-1582735686119-1399-48f10a88?auto=format&fit=crop&w=600&q=70'}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform"></div>
          <div class="p-4"><div class="text-xs text-textlight mb-1">${p.date||''}</div><h3 class="font-semibold text-[#0b1b33] leading-snug line-clamp-2 group-hover:text-primary transition-colors">${p.title}</h3></div></a>`;
      }).join('')+`</div>`;
    } else { rel.style.display='none'; }
  });
</script>
</body>
</html>
