<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
  <h1 class="text-2xl font-bold mb-4">Video Player Test</h1>
  
  <div class="max-w-4xl space-y-6">
    <div class="rounded-2xl overflow-hidden bg-[#061d54] border border-[#1a4a7a] shadow-md">
      <div class="relative aspect-video">
        <video id="testVideo" class="w-full h-full object-cover" controls preload="metadata" playsinline>
          <source src="https://s7d4.scene7.com/is/content/PAWEB/K25AN02525_SmartToilet_NYC_WebHal_10_LK_1920x1080_Master%20MP4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
    
    <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
      <h3 class="font-bold text-yellow-800 mb-2">Debug Info:</h3>
      <ul class="text-sm text-yellow-700">
        <li>• Video URL: https://s7d4.scene7.com/is/content/PAWEB/K25AN02525_SmartToilet_NYC_WebHal_10_LK_1920x1080_Master%20MP4</li>
        <li>• Format: MP4 (H.264)</li>
        <li>• Press F12 to open developer tools</li>
        <li>• Check Console for errors</li>
        <li>• Check Network tab for video request</li>
      </ul>
    </div>
  </div>

  <script>
    console.log("=== Video Test Page ===");
    const video = document.getElementById('testVideo');
    console.log("Video element:", video);
    
    video.onerror = function(e) {
      console.error("Video error:", e);
      alert("视频加载失败！请检查网络连接或浏览器控制台。");
    };
    
    video.onloadeddata = function() {
      console.log("Video loaded successfully");
    };
  </script>
</body>
</html>
