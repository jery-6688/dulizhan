<!-- ============ 登录视图 ============ -->
<div id="loginView" class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-sidebar via-primary to-primary-dark">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 p-8">
      <div class="text-center mb-7">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-primary-dark text-white mb-4 shadow-lg font-extrabold text-3xl">C</div>
        <h1 class="text-2xl font-bold text-primary">网站管理后台</h1>
        <p class="text-sm text-slate-500 mt-1">请登录以管理站点内容</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">用户名</label>
          <input type="text" id="loginUser" name="username" required autocomplete="username"
            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow" placeholder="admin" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">密码</label>
          <input type="password" id="loginPass" name="password" required autocomplete="current-password"
            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow" placeholder="••••••••" />
        </div>
        <div id="loginError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <button type="submit" id="loginBtn" class="w-full py-2.5 bg-primary text-white font-semibold rounded-lg hover:bg-primary-dark transition-colors flex items-center justify-center gap-2 shadow-sm">
        </button>
      </form>
      <div class="mt-5 pt-5 border-t border-slate-200 text-center">
        <button type="button" id="showChgPwdLoginBtn" class="text-sm text-primary hover:text-primary-dark hover:underline font-medium">修改密码</button>
      </div>
      <form id="chgPwdForm" class="hidden space-y-4 mt-5 pt-5 border-t border-slate-200">
        <h3 class="text-lg font-semibold text-primary text-center">修改管理员密码</h3>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">用户名</label>
          <input type="text" name="cp_username" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow" placeholder="admin" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">旧密码</label>
          <input type="password" name="cp_old" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow" placeholder="••••••••" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">新密码（≥8位）</label>
          <input type="password" name="cp_new" required minlength="8" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow" placeholder="••••••••" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">确认新密码</label>
          <input type="password" name="cp_new2" required minlength="8" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow" placeholder="••••••••" />
        </div>
        <div id="chgPwdError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <div class="flex gap-2">
          <button type="button" id="cancelChgPwdBtn" class="flex-1 py-2.5 border border-slate-300 text-slate-700 font-medium rounded-lg hover:bg-slate-50 transition-colors">取消</button>
          <button type="submit" id="chgPwdBtn" class="flex-1 py-2.5 bg-primary text-white font-semibold rounded-lg hover:bg-primary-dark transition-colors flex items-center justify-center gap-2 shadow-sm">
            确认修改
          </button>
        </div>
      </form>
    </div>
    <p class="text-center text-xs text-white/70 mt-4">© CMS · 独立后台系统</p>
  </div>
</div>

<!-- ============ 应用视图 ============ -->
<div id="appView" class="hidden min-h-screen flex">

  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-sidebar text-white transform -translate-x-full md:translate-x-0 transition-transform duration-200 flex flex-col">

  <!-- 主内容 -->

    <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <button id="menuToggle" class="md:hidden text-slate-600 hover:text-slate-900 p-1.5 -ml-1.5 rounded-lg hover:bg-slate-100 transition-colors"></button>
        <div>
          <h2 id="pageTitle" class="font-semibold text-slate-800 text-base">仪表盘</h2>
          <p class="text-[11px] text-slate-400 leading-none mt-0.5" id="pageSub"></p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="userBadge" class="hidden sm:inline-flex items-center gap-2 text-sm">
          <span class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-accent text-white flex items-center justify-center text-xs font-semibold" id="userAvatar"></span>
          <span class="text-slate-600 font-medium" id="userName"></span>
        </span>
      </div>
    </header>
    <main id="content" class="flex-1 p-4 sm:p-6 overflow-x-hidden"></main>
  </div>
</div>

  // ============ 工具 ============
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.prototype.slice.call((el || document).querySelectorAll(s));
  const escapeHtml = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const esc = escapeHtml;

  function toast(msg, type) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg shadow-lg text-sm text-white ' + (type === 'error' ? 'bg-red-600' : type === 'warn' ? 'bg-amber-600' : 'bg-primary');
    t.classList.remove('hidden');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.add('hidden'), 2600);
  }

  // ============ api / upload ============
  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign({}, opts.headers || {});
    if (!(opts.body instanceof FormData) && opts.body !== undefined) {
      headers['Content-Type'] = headers['Content-Type'] || 'application/json';
    }
    if (localStorage.token) headers['Authorization'] = 'Bearer ' + localStorage.token;
    let res;
    try {
      res = await fetch(path, Object.assign({}, opts, { headers: headers }));
    } catch (e) {
      toast('网络错误：' + e.message, 'error');
      throw e;
    }
    if (res.status === 401) {
      localStorage.removeItem('token');
      showLogin();
      throw new Error('未授权');
    }
    let data = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.indexOf('json') !== -1) data = await res.json();
    else data = { success: res.ok, raw: await res.text() };
    if (!res.ok && data && data.message) toast(data.message, 'error');
    return data;
  }

  async function uploadFiles(input) {
    if (!input || !input.files || !input.files.length) return [];
    const fd = new FormData();
    for (let i = 0; i < input.files.length; i++) fd.append('files', input.files[i]);
    let res;
    try {
      res = await fetch('/api/admin/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + (localStorage.token || '') },
        body: fd
      });
    } catch (e) {
      toast('上传失败：' + e.message, 'error');
      throw e;
    }
    if (res.status === 401) {
      localStorage.removeItem('token');
      showLogin();
      throw new Error('未授权');
    }
    const data = await res.json();
    if (!data.success) toast('上传失败', 'error');
    return data.paths || [];
  }

  function showLogin() {
    $('#loginView').classList.remove('hidden');
    $('#appView').classList.add('hidden');
  }
  function showApp() {
    $('#loginView').classList.add('hidden');
    $('#appView').classList.remove('hidden');
    const un = state.user && state.user.username ? state.user.username : 'admin';
    $('#userName').textContent = un;
    $('#userAvatar').textContent = un.charAt(0).toUpperCase();
    nav('dashboard');

  function nav(view) {
    state.view = view;
    state.editing = null;
    state.editingType = null;
    $$('.nav-item').forEach(n => {
      const active = n.dataset.view === view.replace(/-edit$/, '');
      n.classList.toggle('nav-item-active', active);

    state.editingType = type;

    const c = $('#content');
    switch (state.view) {

      case 'product-edit': renderProductEdit(c); break;
      case 'posts': renderPosts(c); break;
      case 'post-edit': renderPostEdit(c); break;
      case 'categories': renderCategories(c); break;
      case 'category-edit': renderCategoryEdit(c); break;
      case 'downloads': renderDownloads(c); break;

  // ============ 登录门控 ============
  async function boot() {
    if (localStorage.token) {
      try {
        const d = await api('/api/admin/auth');
        if (d && d.success && d.user) { state.user = d.user; showApp(); return; }
      } catch (e) { /* 401 已处理 */ }
    }
    showLogin();
  }

  // ============ 登录 ============
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#loginBtn');
    btn.disabled = true; btn.innerHTML = spinner('w-4 h-4') + '<span>登录中...</span>';
    const err = $('#loginError'); err.classList.add('hidden');
    const u = $('#loginUser').value.trim();
    const p = $('#loginPass').value;
    if (!u || !p) { err.textContent = '请输入用户名和密码'; err.classList.remove('hidden'); btn.disabled = false; btn.innerHTML = ic('logout', 'w-4 h-4') + '<span>登录</span>'; return; }
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d && d.success && d.token) {
        localStorage.token = d.token;
        state.user = { username: u };
        showApp();
      } else {
        err.textContent = (d && d.message) || '登录失败'; err.classList.remove('hidden');
      }
    } catch (e) {
      err.textContent = '登录失败，请重试'; err.classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.innerHTML = ic('logout', 'w-4 h-4') + '<span>登录</span>';
    }
  });

  $('#logoutBtn').addEventListener('click', async () => {

  });

  function imageField(label, name, value) {

        '</div>' +

          '<input type="text" name="' + name + '" value="' + esc(value || '') + '" placeholder="图片 URL 或上传" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none text-sm transition-shadow" data-url />' +

              '<input type="file" accept="image/*" class="hidden" data-upload /></label>' +
          '</div>' +
        '</div>' +
      '</div></div>';
  }
  function bindImageField(root, name) {
    const box = root.querySelector('[data-imgfield="' + name + '"]');
    if (!box) return;
    const url = box.querySelector('[data-url]');
    const prev = box.querySelector('[data-prev]');
    const up = box.querySelector('[data-upload]');
    url.addEventListener('input', () => { prev.src = url.value; prev.style.display = url.value ? '' : 'none'; });
    up.addEventListener('change', async () => {
      try { const paths = await uploadFiles(up); if (paths[0]) { url.value = paths[0]; prev.src = paths[0]; prev.style.display = ''; } }
      catch (e) {} finally { up.value = ''; }
    });
  }

  // ============ 通用数组操作 helper ============
  function arrItemMove(arr, idx, dir) {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= arr.length) return arr.slice();
    const result = arr.slice();
    const tmp = result[idx];
    result[idx] = result[newIdx];
    result[newIdx] = tmp;
    return result;
  }

  function upDownDeleteButtons(idx, arrLength, onUp, onDown, onDel) {
    const disUp = idx === 0 ? ' opacity-40 cursor-not-allowed" disabled' : '"';
    const disDown = idx === arrLength - 1 ? ' opacity-40 cursor-not-allowed" disabled' : '"';
    return '<div class="flex items-center gap-1">' +
      '<button type="button" class="arr-up inline-flex items-center justify-center w-7 h-7 rounded text-slate-500 hover:bg-slate-100 transition-colors' + disUp + ' data-idx="' + idx + '" title="上移">' + ic('arrow-up', 'w-3.5 h-3.5') + '</button>' +
      '<button type="button" class="arr-down inline-flex items-center justify-center w-7 h-7 rounded text-slate-500 hover:bg-slate-100 transition-colors' + disDown + ' data-idx="' + idx + '" title="下移">' +
        '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-3.5 h-3.5"><path d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>' +
      '</button>' +
      '<button type="button" class="arr-del inline-flex items-center justify-center w-7 h-7 rounded text-red-500 hover:bg-red-50 transition-colors" data-idx="' + idx + '" title="删除">' + ic('trash', 'w-3.5 h-3.5') + '</button>' +
    '</div>';

  function bindArrButtons(box, arrRef, onReRender) {
    box.querySelectorAll('.arr-up').forEach(b => b.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();

    box.querySelectorAll('.arr-down').forEach(b => b.addEventListener('click', (e) => {

    const tools = [

      { block: 'h3', label: 'H3', title: '标题3', isText: true },
      { block: 'p', icon: 'list', title: '段落' },
      { cmd: 'insertUnorderedList', icon: 'list', title: '无序列表' },
      { act: 'link', icon: 'link', title: '链接' },
      { act: 'img-url', icon: 'image', title: '插入图片URL' },
      { act: 'img-up', icon: 'upload', title: '上传图片' }
    ];
    box.innerHTML =
      '<div class="border border-slate-300 rounded-lg overflow-hidden bg-white">' +
        '<div class="flex flex-wrap items-center gap-0.5 px-2 py-1.5 border-b border-slate-200 bg-slate-50">' +
          tools.map(t => {
            const inner = t.isText ? '<span class="text-sm ' + (t.cls || '') + '">' + t.label + '</span>' : ic(t.icon, 'w-4 h-4');
            const dataAttr = t.cmd ? 'data-cmd="' + t.cmd + '"' : t.block ? 'data-block="' + t.block + '"' : 'data-act="' + t.act + '"';
            return '<button type="button" ' + dataAttr + ' title="' + esc(t.title) + '" class="w-8 h-8 rounded hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-colors">' + inner + '</button>';
          }).join('') +
        '</div>' +
        '<div class="rich-editor px-3 py-2 text-sm" contenteditable="true" data-placeholder="' + esc(placeholder || '') + '">' + (initialHTML || '') + '</div>' +
        '<input type="file" accept="image/*" class="hidden" data-imgup />' +
      '</div>';
    const ed = box.querySelector('.rich-editor');
    ed.addEventListener('focus', () => ed.classList.add('ring-2', 'ring-primary'));
    ed.addEventListener('blur', () => ed.classList.remove('ring-2', 'ring-primary'));
    box.querySelectorAll('button[data-cmd], button[data-block], button[data-act]').forEach(b => {
      b.addEventListener('click', async (e) => {
        e.preventDefault();
        ed.focus();
        if (b.dataset.cmd) { document.execCommand(b.dataset.cmd, false, null); }
        else if (b.dataset.block) {
          if (b.dataset.block === 'p') document.execCommand('formatBlock', false, 'p');
          else document.execCommand('formatBlock', false, b.dataset.block);
        } else if (b.dataset.act === 'link') {
          const u = prompt('输入链接 URL：');
          if (u) document.execCommand('createLink', false, u);
        } else if (b.dataset.act === 'img-url') {
          const u = prompt('输入图片 URL：');
          if (u) document.execCommand('insertImage', false, u);
        } else if (b.dataset.act === 'img-up') {
          const inp = box.querySelector('[data-imgup]');
          inp.onchange = async () => {
            try { const paths = await uploadFiles(inp); if (paths[0]) { document.execCommand('insertImage', false, paths[0]); } }
            catch (e) {} finally { inp.value = ''; }
          };
          inp.click();
        }
      });
    });
    return { getHTML: () => ed.innerHTML };
  }

  }

  function renderCalendar(year, month, dailyData, selectedDate) {
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date().toISOString().slice(0, 10);
    const m = String(month + 1).padStart(2, '0');
    const maxCount = Math.max(...Object.values(dailyData || {}), 1);
    let html = '<div class="grid grid-cols-7 gap-1 text-center text-[11px] text-slate-400 mb-1"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>';
    html += '<div class="grid grid-cols-7 gap-1">';
    for (let i = 0; i < firstDay; i++) html += '<div></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = year + '-' + m + '-' + String(d).padStart(2, '0');
      const count = dailyData && dailyData[ds] ? dailyData[ds] : 0;
      const intensity = count > 0 ? Math.min(4, Math.ceil(count / maxCount * 4)) : 0;
      const bg = count === 0 ? 'bg-slate-50' :
        intensity === 1 ? 'bg-primary/10' :
        intensity === 2 ? 'bg-primary/25' :
        intensity === 3 ? 'bg-primary/50' : 'bg-primary';
      const txtColor = count > 0 && intensity >= 3 ? 'text-white' : 'text-slate-700';
      const isToday = ds === today;
      const isSel = ds === selectedDate;
      html += '<div class="cal-day cursor-pointer rounded-md aspect-square flex flex-col items-center justify-center text-xs ' + bg + ' ' + txtColor + ' ' + (isToday ? 'ring-2 ring-accent' : '') + ' ' + (isSel ? 'outline outline-2 outline-accent ring-0' : '') + '" data-date="' + ds + '" title="' + ds + ': ' + count + ' 次访问">' +
        '<span class="font-medium">' + d + '</span>' +
        (count > 0 ? '<span class="text-[9px] opacity-70">' + count + '</span>' : '') +
      '</div>';
    }
    html += '</div>';
    return html;
  }

      const calTitle = c.querySelector('#calTitle');

        calTitle.textContent = dashState.calYear + '年' + (dashState.calMonth + 1) + '月';

        grid.innerHTML = renderCalendar(dashState.calYear, dashState.calMonth, an.daily.reduce((o, d) => { o[d.date] = d.count; return o; }, {}), dashState.selectedDate);
        grid.querySelectorAll('.cal-day').forEach(el => {
          el.addEventListener('click', () => {
            dashState.selectedDate = el.dataset.date;
            updateCalendar();
            showDateDetail(dashState.selectedDate);
          });
        });
      }

        dashState.calMonth--;
        if (dashState.calMonth < 0) { dashState.calMonth = 11; dashState.calYear--; }
        updateCalendar();
      };
      c.querySelector('#calNext').onclick = () => {

        try {
          const token = localStorage.token;
          const res = await fetch('/api/admin/analytics/export', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (!res.ok) throw new Error('导出失败（' + res.status + '）');
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'analytics-export-' + new Date().toISOString().slice(0, 10) + '.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          toast('导出成功！', 'success');
        } catch (e) {
          toast('导出失败：' + e.message, 'error');

    $('#appsAdd').addEventListener('click', appsMgr.add);
    const instMgr = makeObjList($('#instBox'), f.install, [{ key: 'n', label: '序号 01' }, { key: 't', label: '标题' }, { key: 'd', label: '描述', type: 'textarea' }]);
    $('#instAdd').addEventListener('click', instMgr.add);
    const faqMgr = makeObjList($('#faqBox'), f.faq, [{ key: 'q', label: '问题' }, { key: 'a', label: '回答', type: 'textarea' }]);
    $('#faqAdd').addEventListener('click', faqMgr.add);

    // --- 颜色 SKU 管理 ---
    const colorSkuBox = $('#colorSkuBox');
    function renderColorSkus() {
      const colors = Object.keys(f.colorImages);
      if (!colors.length) {
        colorSkuBox.innerHTML = '<p class="text-xs text-slate-400">暂无颜色 SKU，选择颜色、输入名称和价格后点击"添加颜色"</p>';
        return;
      }
      colorSkuBox.innerHTML = colors.map((color, ci) => {
        const images = f.colorImages[color] || [];
        const price = f.colorPrices[color] || '';
        const colorVal = f.colorValues[color] || '#cccccc';
        return '<div class="color-sku-item border border-slate-200 rounded-lg p-3 bg-slate-50" data-color="' + esc(color) + '">' +
          '<div class="flex items-center gap-2 mb-2">' +
            '<input type="color" class="color-value w-10 h-10 rounded border border-slate-300 cursor-pointer flex-shrink-0" value="' + esc(colorVal) + '" title="选择颜色" />' +
            '<div class="color-preview w-10 h-10 rounded-full border-2 border-white shadow flex-shrink-0" style="background-color:' + esc(colorVal) + '"></div>' +
            '<input type="text" class="color-name flex-1 px-2 py-1.5 border border-slate-300 rounded text-sm font-medium" value="' + esc(color) + '" placeholder="颜色名称" />' +
            '<input type="text" class="color-price w-52 px-2 py-1.5 border border-slate-300 rounded text-sm" value="' + esc(price) + '" placeholder="价格，如：From $29.90 / unit" />' +
            '<button type="button" class="color-del w-7 h-7 flex items-center justify-center text-red-500 hover:bg-red-100 rounded transition-colors flex-shrink-0" title="删除颜色">' + ic('trash', 'w-4 h-4') + '</button>' +
          '</div>' +
          '<div class="color-images-box flex flex-wrap gap-2 mb-2">' +
            images.map((src, ii) =>
              '<div class="color-img-item relative group" data-idx="' + ii + '">' +
                '<img src="' + esc(src) + '" onerror="this.src=\'\';this.alt=\'加载失败\'" class="w-16 h-16 object-cover rounded border border-slate-200 bg-white" />' +
                '<button type="button" class="color-img-del absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-600 text-white rounded-full hidden group-hover:flex items-center justify-center" data-idx="' + ii + '">' + ic('close', 'w-3 h-3') + '</button>' +
              '</div>'
            ).join('') +
          '</div>' +
          '<div class="flex items-center gap-2">' +
            '<label class="inline-flex items-center gap-1 px-2 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-600 rounded text-xs cursor-pointer transition-colors">' + ic('upload', 'w-3 h-3') + '<span>上传</span><input type="file" accept="image/*" multiple class="hidden color-img-upload" /></label>' +
            '<input type="text" class="color-img-url flex-1 px-2 py-1 border border-slate-300 rounded text-xs" placeholder="粘贴图片URL后点击添加" />' +
            '<button type="button" class="color-img-add px-2 py-1 bg-primary text-white rounded text-xs">添加</button>' +
          '</div>' +
        '</div>';
      }).join('');

      // 绑定删除颜色
      colorSkuBox.querySelectorAll('.color-del').forEach(btn => {
        btn.addEventListener('click', () => {
          const c = btn.closest('.color-sku-item').dataset.color;
          delete f.colorImages[c];
          delete f.colorPrices[c];
          delete f.colorValues[c];
          renderColorSkus();
        });
      });
      // 绑定颜色名/价格/色值修改
      colorSkuBox.querySelectorAll('.color-sku-item').forEach(item => {
        const oldColor = item.dataset.color;
        const nameInput = item.querySelector('.color-name');
        const priceInput = item.querySelector('.color-price');
        const colorInput = item.querySelector('.color-value');
        const previewDiv = item.querySelector('.color-preview');
        nameInput.addEventListener('change', () => {
          const newName = nameInput.value.trim();
          if (!newName || newName === oldColor) return;
          if (f.colorImages[oldColor]) {
            f.colorImages[newName] = f.colorImages[oldColor];
            delete f.colorImages[oldColor];
          }
          if (f.colorPrices[oldColor] !== undefined) {
            f.colorPrices[newName] = f.colorPrices[oldColor];
            delete f.colorPrices[oldColor];
          }
          if (f.colorValues[oldColor] !== undefined) {
            f.colorValues[newName] = f.colorValues[oldColor];
            delete f.colorValues[oldColor];
          }
          renderColorSkus();
        });
        priceInput.addEventListener('input', () => {
          f.colorPrices[oldColor] = priceInput.value;
        });
        colorInput.addEventListener('input', () => {
          f.colorValues[oldColor] = colorInput.value;
          previewDiv.style.backgroundColor = colorInput.value;
        });
      });
      // 绑定图片删除
      colorSkuBox.querySelectorAll('.color-img-del').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = btn.closest('.color-sku-item');
          const color = item.dataset.color;
          const idx = +btn.dataset.idx;
          if (f.colorImages[color]) {
            f.colorImages[color].splice(idx, 1);
            renderColorSkus();
          }
        });
      });
      // 绑定图片URL添加
      colorSkuBox.querySelectorAll('.color-img-add').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = btn.closest('.color-sku-item');
          const color = item.dataset.color;
          const urlInput = item.querySelector('.color-img-url');
          const u = urlInput.value.trim();
          if (u && f.colorImages[color]) {
            f.colorImages[color].push(u);
            urlInput.value = '';
            renderColorSkus();
          }
        });
      });
      // 绑定图片上传
      colorSkuBox.querySelectorAll('.color-img-upload').forEach(inp => {
        inp.addEventListener('change', async (e) => {
          const item = inp.closest('.color-sku-item');
          const color = item.dataset.color;
          try {
            const paths = await uploadFiles(inp);
            if (paths && paths.length && f.colorImages[color]) {
              paths.forEach(p => f.colorImages[color].push(p));
              renderColorSkus();
            }
          } catch (e) {} finally { inp.value = ''; }
        });
      });
    }
    $('#colorAddBtn').addEventListener('click', () => {
      const name = $('#colorNameInput').value.trim();
      const price = $('#colorPriceInput').value.trim();
      const colorVal = $('#colorValueInput').value;
      if (!name) { toast('请输入颜色名称', 'warn'); return; }
      if (!f.colorImages[name]) f.colorImages[name] = [];
      if (price) f.colorPrices[name] = price;
      f.colorValues[name] = colorVal;
      $('#colorNameInput').value = '';
      $('#colorPriceInput').value = '';
      $('#colorValueInput').value = '#cccccc';
      renderColorSkus();
    });
    renderColorSkus();

    // --- 长图相册 (longGallery) 管理 ---
    const longGalBox = $('#longGalBox');
    function renderLongGal() {
      if (!f.longGallery.length) {
        longGalBox.innerHTML = '<p class="text-xs text-slate-400">暂无非长图，点击右上角新增</p>';
        return;
      }
      longGalBox.innerHTML = f.longGallery.map((item, i) =>
        '<div class="long-gal-item flex flex-wrap items-start gap-2 bg-slate-50 border border-slate-200 p-2.5 rounded-lg" data-idx="' + i + '">' +
          '<div class="flex flex-col gap-1">' +
            '<div class="w-16 h-16 rounded border border-slate-200 bg-white overflow-hidden"><img src="' + esc(item.src || '') + '" onerror="this.style.display=\'none\'" class="w-full h-full object-cover" /></div>' +
            '<label class="inline-flex items-center justify-center w-16 text-[10px] text-slate-500 hover:text-primary cursor-pointer">' + ic('upload', 'w-3 h-3') + '<input type="file" accept="image/*" class="hidden long-gal-up" data-idx="' + i + '" /></label>' +
          '</div>' +
          '<div class="flex-1 min-w-[200px] space-y-1.5">' +
            '<input type="text" class="long-gal-src w-full px-2 py-1.5 border border-slate-300 rounded text-sm" data-idx="' + i + '" value="' + esc(item.src || '') + '" placeholder="图片路径" />' +
            '<input type="text" class="long-gal-caption w-full px-2 py-1.5 border border-slate-300 rounded text-sm" data-idx="' + i + '" value="' + esc(item.caption || '') + '" placeholder="说明文字 (caption)" />' +
            '<input type="text" class="long-gal-aspect w-full px-2 py-1.5 border border-slate-300 rounded text-sm" data-idx="' + i + '" value="' + esc(item.aspect || '') + '" placeholder="宽高比 (如 aspect-[4/3] 或留空)" />' +
          '</div>' +
          '<div class="flex flex-col gap-1">' +
            upDownDeleteButtons(i, f.longGallery.length) +
          '</div>' +
        '</div>'
      ).join('');

      // 绑定输入
      longGalBox.querySelectorAll('.long-gal-src, .long-gal-caption, .long-gal-aspect').forEach(inp => {
        inp.addEventListener('input', () => {
          const i = +inp.dataset.idx;
          const key = inp.classList.contains('long-gal-src') ? 'src' : inp.classList.contains('long-gal-caption') ? 'caption' : 'aspect';
          if (f.longGallery[i]) f.longGallery[i][key] = inp.value;
        });
      });
      // 绑定上传
      longGalBox.querySelectorAll('.long-gal-up').forEach(inp => {
        inp.addEventListener('change', async () => {
          const i = +inp.dataset.idx;
          try {
            const paths = await uploadFiles(inp);
            if (paths && paths[0] && f.longGallery[i]) {
              f.longGallery[i].src = paths[0];
              renderLongGal();
            }
          } catch (e) {} finally { inp.value = ''; }
        });
      });
      // 绑定排序/删除按钮
      const longGalArrRef = {
        get value() { return f.longGallery; },
        set value(v) { f.longGallery = v; }
      };
      bindArrButtons(longGalBox, longGalArrRef, renderLongGal);
    }
    $('#longGalAdd').addEventListener('click', () => {
      f.longGallery.push({ src: '', caption: '', aspect: '' });
      renderLongGal();
    });
    renderLongGal();

    $('#pBack').addEventListener('click', () => nav('products'));

    $('#pSave').addEventListener('click', async () => {
      const form = $('#pForm');
      const fd = new FormData(form);
      // 清理空的 colorImages 条目
      const cleanColorImages = {};
      Object.keys(f.colorImages).forEach(c => {
        const imgs = (f.colorImages[c] || []).filter(x => x && x.trim());
        if (imgs.length) cleanColorImages[c] = imgs;
      });
      const cleanColorPrices = {};
      Object.keys(f.colorPrices).forEach(c => {
        if (cleanColorImages[c] && f.colorPrices[c]) cleanColorPrices[c] = f.colorPrices[c];
      });
      const cleanColorValues = {};
      Object.keys(f.colorValues).forEach(c => {
        if (cleanColorImages[c] && f.colorValues[c]) cleanColorValues[c] = f.colorValues[c];
      });
      const product = Object.assign({}, p, {
        name: fd.get('name') || '', sku: fd.get('sku') || '', category: fd.get('category') || '',
        tag: fd.get('tag') || '', price: fd.get('price') || '', daily: fd.get('daily') || '',
        countries: fd.get('countries') || '', leadt: fd.get('leadt') || '', moq: fd.get('moq') || '',
        videoUrl: fd.get('videoUrl') || '', status: fd.get('status') || 'published',
        short: fd.get('short') || '', long: fd.get('long') || '', overview: fd.get('overview') || '', why: fd.get('why') || '',
        image: (form.querySelector('[data-imgfield="image"] [data-url]') || {}).value || '',
        gallery: f.gallery.slice(),
        features: f.features.filter(x => x && x.trim()),
        certs: f.certs.filter(x => x && x.trim()),
        highlights: f.highlights.filter(x => x.icon || x.text),
        media: f.media.filter(x => x.title || x.desc),
        apps: f.apps.filter(x => x.title || x.desc),
        install: f.install.filter(x => x.t || x.d),
        faq: f.faq.filter(x => x.q || x.a),
        specs: f.specs.reduce((o, x) => { if (x.key) o[x.key] = x.value; return o; }, {}),
        colorImages: cleanColorImages,
        colorPrices: cleanColorPrices,
        colorValues: cleanColorValues,
        longGallery: f.longGallery.filter(x => x && (x.src || x.caption))
      });
      try {
        const url = isNew ? '/api/admin/products' : '/api/admin/products/' + encodeURIComponent(p.id);
        const method = isNew ? 'POST' : 'PUT';
        const d = await api(url, { method: method, body: JSON.stringify({ product: product }) });
        if (d && d.success) { toast('保存成功'); nav('products'); }
      } catch (e) {}
    });
  }

    });

  // ============ 修改密码 ============
  function showChgPwdForm() {
    $('#chgPwdForm').classList.remove('hidden');
    $('#chgPwdError').classList.add('hidden');
    const f = $('#chgPwdForm');
    f.cp_username.value = f.cp_username.value || 'admin';
    f.cp_old.value = '';
    f.cp_new.value = '';
    f.cp_new2.value = '';
  }
  function hideChgPwdForm() {
    $('#chgPwdForm').classList.add('hidden');
    $('#chgPwdError').classList.add('hidden');
  }
  async function submitChgPwd(e) {
    e.preventDefault();
    const f = e.target;
    const username = f.cp_username.value.trim();
    const oldPassword = f.cp_old.value;
    const newPassword = f.cp_new.value;
    const newPassword2 = f.cp_new2.value;
    const errEl = $('#chgPwdError');
    errEl.classList.add('hidden');
    if (!username || !oldPassword || !newPassword || !newPassword2) {
      errEl.textContent = '请填写所有字段'; errEl.classList.remove('hidden'); return;
    }
    if (newPassword.length < 8) {
      errEl.textContent = '新密码长度至少 8 位'; errEl.classList.remove('hidden'); return;
    }
    if (newPassword !== newPassword2) {
      errEl.textContent = '两次输入的新密码不一致'; errEl.classList.remove('hidden'); return;
    }
    const btn = $('#chgPwdBtn');
    const origHtml = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = spinner('w-4 h-4') + '<span>处理中...</span>';
    try {
      // 用 token 调改密接口
      const chgRes = await fetch('/api/admin/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.token || '') },
        body: JSON.stringify({ oldPassword, newPassword })
      });
      const chgData = await chgRes.json().catch(() => ({}));
      if (!chgRes.ok || !chgData.success) {
        errEl.textContent = (chgData && chgData.message) || '修改失败'; errEl.classList.remove('hidden'); return;
      }
      toast('密码已修改，请重新登录');
      hideChgPwdForm();
      localStorage.removeItem('token');
      state.user = null;
      showLogin();
    } catch (ex) {
      errEl.textContent = '修改失败：' + ex.message; errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.innerHTML = origHtml;
    }
  }

        '<p class="text-sm text-slate-500">为博客文章单独设置 SEO 信息。</p>' +
        '<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-left text-sm">' +
        '<thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider"><tr><th class="px-4 py-3 font-medium">文章</th><th class="px-4 py-3 font-medium">SEO Title</th><th class="px-4 py-3 font-medium">状态</th><th class="px-4 py-3 font-medium text-right">操作</th></tr></thead>' +
        '<tbody>' + posts.map(p => {
          const ps = blogSEO[p.id] || {};
          return '<tr class="border-b border-slate-100 hover:bg-slate-50">' +
            '<td class="px-4 py-3"><div class="font-medium text-slate-900 max-w-[200px] truncate">' + esc(p.title) + '</div><div class="text-xs text-slate-400">/' + esc(p.slug || p.id) + '</div></td>' +
            '<td class="px-4 py-3 max-w-[250px]"><div class="truncate text-xs text-slate-600">' + esc(ps.title || p.title) + '</div></td>' +
            '<td class="px-4 py-3">' + (ps.title ? '<span class="text-emerald-600 text-xs">✓ 已设</span>' : '<span class="text-slate-400 text-xs">自动</span>') + '</td>' +
            '<td class="px-4 py-3 text-right"><button class="post-seo-edit px-2 py-1 text-primary hover:bg-primary/10 rounded text-xs" data-id="' + esc(p.id) + '">编辑</button></td>' +
          '</tr>';
        }).join('') + '</tbody></table></div></div>' +
        '<div id="postSEODetail" class="hidden"></div>' +
        '</div>';

      sc.querySelectorAll('.post-seo-edit').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.id;
          const p = posts.find(x => x.id === id);
          if (!p) return;
          const ps = blogSEO[id] || {};
          const detail = sc.querySelector('#postSEODetail');
          detail.classList.remove('hidden');
          detail.scrollIntoView({ behavior: 'smooth' });
          detail.innerHTML =
            '<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mt-4">' +
            '<h4 class="font-semibold text-slate-800 mb-4">博客 SEO：' + esc(p.title) + '</h4>' +
            '<div class="space-y-3">' +
              '<div><label class="block text-sm font-medium text-slate-700 mb-1.5">SEO Title</label><input type="text" class="post-seo-title w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" value="' + esc(ps.title || '') + '" placeholder="' + esc(p.title) + '" /></div>' +
              '<div><label class="block text-sm font-medium text-slate-700 mb-1.5">Meta Description</label><textarea class="post-seo-desc w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" rows="2" placeholder="' + esc(p.excerpt || '') + '">' + esc(ps.description || '') + '</textarea></div>' +
              '<div><label class="block text-sm font-medium text-slate-700 mb-1.5">Focus Keyword</label><input type="text" class="post-seo-kw w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" value="' + esc(ps.keyword || '') + '" /></div>' +
              '<div class="flex justify-end gap-2">' +
                '<button type="button" class="post-seo-cancel px-3 py-1.5 border border-slate-300 rounded-lg text-sm hover:bg-slate-50">取消</button>' +
                '<button type="button" class="post-seo-save px-3 py-1.5 bg-primary text-white rounded-lg text-sm hover:bg-primary-dark" data-id="' + esc(id) + '">保存</button>' +
              '</div>' +
            '</div></div>';
          detail.querySelector('.post-seo-cancel').onclick = () => { detail.classList.add('hidden'); detail.innerHTML = ''; };
          detail.querySelector('.post-seo-save').onclick = async () => {
            const pid = btn.dataset.id;
            const card = detail.querySelector('.bg-white');
            const data = {
              title: card.querySelector('.post-seo-title').value,
              description: card.querySelector('.post-seo-desc').value,
              keyword: card.querySelector('.post-seo-kw').value
            };
            blogSEO[pid] = data;
            seo.posts = blogSEO;
            try {
              const r = await api('/api/admin/seo/posts/' + encodeURIComponent(pid), { method: 'PUT', body: JSON.stringify({ seo: data }) });
              if (r && r.success) { toast('博客 SEO 已保存'); detail.classList.add('hidden'); detail.innerHTML = ''; }
            } catch (e) {}
          };
        };
      });
    }

    // --- Tools: Sitemap / Robots ---
    function renderToolsSEO(sc, seo) {
      const g = seo.global || {};
      sc.innerHTML =
        '<div class="space-y-4">' +
        sectionCard('XML Sitemap',
          '<div class="space-y-3">' +
            '<p class="text-sm text-slate-500">自动生成站点地图，帮助搜索引擎发现和索引页面。</p>' +
            '<div class="flex items-center gap-2">' +
              '<code class="px-2 py-1 bg-slate-100 rounded text-xs">' + esc((g.siteUrl || 'https://www.xinpaezshower.com').replace(/\/$/, '')) + '/sitemap.xml</code>' +
              '<a href="/sitemap.xml" target="_blank" class="text-primary text-xs hover:underline">查看当前</a>' +
            '</div>' +
            '<button type="button" id="genSitemap" class="px-3 py-1.5 bg-primary text-white rounded-lg text-sm hover:bg-primary-dark inline-flex items-center gap-1.5">' + ic('refresh', 'w-4 h-4') + '<span>重新生成 Sitemap</span></button>' +
          '</div>'
        ) +
        sectionCard('Robots.txt',
          '<div class="space-y-3">' +
            '<p class="text-sm text-slate-500">控制搜索引擎爬虫行为。</p>' +
            '<div class="flex items-center gap-2">' +
              '<code class="px-2 py-1 bg-slate-100 rounded text-xs">/robots.txt</code>' +
              '<a href="/robots.txt" target="_blank" class="text-primary text-xs hover:underline">查看当前</a>' +
            '</div>' +
            '<textarea id="robotsContent" class="w-full h-40 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none font-mono text-xs" placeholder="User-agent: *\nAllow: /\nSitemap: ' + esc((g.siteUrl || 'https://www.xinpaezshower.com')) + '/sitemap.xml">' + esc(seo.robots || '') + '</textarea>' +
            '<div class="flex justify-end"><button type="button" id="saveRobots" class="px-3 py-1.5 bg-primary text-white rounded-lg text-sm hover:bg-primary-dark">保存 Robots.txt</button></div>' +
          '</div>'
        ) +
        sectionCard('快速检测',
          '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="seoCheckList">' +
            '<div class="text-center p-3 rounded-lg bg-slate-50"><div class="text-2xl font-bold text-slate-800" id="checkPages">0</div><div class="text-xs text-slate-500">已配置页面</div></div>' +
            '<div class="text-center p-3 rounded-lg bg-slate-50"><div class="text-2xl font-bold text-slate-800" id="checkProducts">0</div><div class="text-xs text-slate-500">已配置产品SEO</div></div>' +
            '<div class="text-center p-3 rounded-lg bg-slate-50"><div class="text-2xl font-bold text-slate-800" id="checkMissing">0</div><div class="text-xs text-slate-500">待配置页面</div></div>' +
            '<div class="text-center p-3 rounded-lg bg-slate-50"><div class="text-2xl font-bold text-slate-800" id="checkTotal">0</div><div class="text-xs text-slate-500">产品总数</div></div>' +
          '</div>'
        );

      // 统计
      const pageKeys = ['home', 'products', 'product-detail', 'solutions', 'oem', 'about', 'support', 'downloads', 'news', 'contact', 'factory', 'certifications'];
      const configuredCount = pageKeys.filter(k => pages[k] && pages[k].title).length;
      const productSEOCount = Object.keys(productSEO).filter(k => productSEO[k].title).length;
      $('#checkPages').textContent = configuredCount;
      $('#checkProducts').textContent = productSEOCount;
      $('#checkMissing').textContent = pageKeys.length - configuredCount;
      $('#checkTotal').textContent = (products || []).length;

      sc.querySelector('#genSitemap').onclick = async () => {
        try {
          const r = await api('/api/admin/seo/regenerate-sitemap', { method: 'POST' });
          if (r && r.success) toast('Sitemap 已重新生成');
        } catch (e) {}
      };
      sc.querySelector('#saveRobots').onclick = async () => {
        const content = sc.querySelector('#robotsContent').value;
        seo.robots = content;
        try {
          const r = await api('/api/admin/seo/robots', { method: 'PUT', body: JSON.stringify({ content: content }) });
          if (r && r.success) toast('Robots.txt 已保存');
        } catch (e) {}
      };
    }

    // 初始渲染
    renderTab('global');
  }

  // ============ 初始化 ============
  initStaticUI();
  $$('.nav-item').forEach(n => n.addEventListener('click', () => nav(n.dataset.view)));
  $('#showChgPwdLoginBtn').addEventListener('click', showChgPwdForm);
  $('#cancelChgPwdBtn').addEventListener('click', hideChgPwdForm);
  $('#chgPwdForm').addEventListener('submit', submitChgPwd);

  // 启动：先校验登录态
  boot();
})();
</script>
</body>
</html>
